# Tests every push to main and publishes one signed release with the Linux
# server, collector and panel, the phone app and the Mac apps. Linux machines
# install it with deploy/linux/telemetry-update.sh, the Mac with
# deploy/macos/telemetry-update.sh, and the phone through Obtainium. Release
# files are public, so they carry no addresses or keys: each device keeps its
# own.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: r${{ github.run_number }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Test
        run: |
          # The Mac launchd scripts are zsh and have tests.
          sudo apt-get install -y -q zsh
          go vet ./...
          go test ./...
      - name: Test and build the panel
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Build
        run: |
          mkdir dist
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go build -trimpath -o dist/telemetryd ./cmd/telemetryd
          go build -trimpath -o dist/telemetry-places ./cmd/telemetry-places
          go build -trimpath -ldflags "-X main.collectorVersion=telemetry-desktop/$TAG" -o dist/telemetry-desktop ./cmd/telemetry-desktop
          tar -C web -czf dist/panel.tar.gz build
          ls internal/store/migrations > dist/migrations.txt
          cp deploy/linux/telemetry-update.sh dist/
          cp deploy/macos/telemetry-update.sh dist/telemetry-update-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version code is the number of commits.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        # Releases install over the existing app only with the same key.
        run: |
          mkdir -p ~/.android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - name: Test and build
        working-directory: android
        # The project keeps Gradle small for the owner's machines; GitHub's
        # runner needs more to merge the app's dependencies.
        run: gradle --no-daemon -Dorg.gradle.jvmargs=-Xmx4g :app:testDebugUnitTest :app:assembleDebug
      - run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/telemetry-phone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Signing identity
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        # macOS grants Accessibility to the certificate, so releases are
        # signed with the same one the Mac's own installs use.
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$MAC_SIGNING_P12" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Test
        run: go test ./internal/desktop/... ./internal/collector/... ./cmd/telemetry-desktop/...
      - name: Build the apps
        run: |
          mkdir dist
          work="$RUNNER_TEMP/apps"
          desktop="$work/Telemetry Desktop.app"
          mkdir -p "$desktop/Contents/MacOS"
          cp deploy/macos/TelemetryDesktop/Info.plist "$desktop/Contents/Info.plist"
          go build -trimpath -ldflags "-X main.collectorVersion=telemetry-desktop/$TAG" -o "$desktop/Contents/MacOS/telemetry-desktop" ./cmd/telemetry-desktop
          identity=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/Telemetry Desktop Signing/ {print $2; exit}')
          codesign -f --keychain "$KEYCHAIN" -s "$identity" "$desktop"
          codesign -dr - "$desktop"

          panel="$work/Telemetry.app"
          mkdir -p "$panel/Contents/MacOS" "$panel/Contents/Resources"
          cp deploy/macos/TelemetryPanel/Info.plist "$panel/Contents/Info.plist"
          swiftc -O -o "$panel/Contents/MacOS/Telemetry" deploy/macos/TelemetryPanel/main.swift
          iconset="$work/Telemetry.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size web/static/icon-512.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) web/static/icon-512.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$panel/Contents/Resources/Telemetry.icns"
          codesign -f -s - "$panel"

          ditto -c -k --keepParent "$desktop" dist/telemetry-desktop-macos.zip
          ditto -c -k --keepParent "$panel" dist/telemetry-panel-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  publish:
    needs: [linux, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          echo "$TAG $GITHUB_SHA" > dist/release.txt
          (cd dist && sha256sum -- * > SHA256SUMS)
          key="$RUNNER_TEMP/release-key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -Y sign -q -f "$key" -n telemetry-release dist/SHA256SUMS
          ssh-keygen -Y verify -f deploy/release-signers -I telemetry-release -n telemetry-release -s dist/SHA256SUMS.sig < dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes "$(git log -1 --format=%s)"
